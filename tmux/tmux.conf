# Set environment variable to indicate remote session if in SSH or Docker
if '[ -n "$SSH_CLIENT" ] || [ -f /.dockerenv ]' {
    setenv -g TMUX_REMOTE 1
}

set -g default-command "${SHELL}"

# Select pane
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

setw -g mode-keys vi
set -g repeat-time 500

set -g repeat-time 500

# Move window
bind -r < swap-window -t -1
bind -r > swap-window -t +1

# rename session
bind . command-prompt -I "#S" "rename-session '%%'"

# Resize panes like vim
bind -r H resize-pane -L 2
bind -r L resize-pane -R 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2

# TrueColor
set -g  default-terminal   "tmux-256color"
set -ag terminal-overrides ",tmux-256color:RGB:sitm=\\E\[3m"
set -as terminal-features  ",tmux-256color:clipboard"
set -ag terminal-features  ",*:hyperlinks"

set -g history-limit 102400 # boost history
set -g status-keys   emacs

# Capture pane and save to file
bind P command-prompt -p "Save to:" -I "/tmp/tmux-capture.txt" "capture-pane -S -; save-buffer '%%'"

# Copy
setw -g mode-keys vi
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi L      send -X end-of-line
bind -T copy-mode-vi H      send -X start-of-line

# Clipboard
set -s set-clipboard on

# Mouse support
set -qg mouse on

# Index & Name
set  -g base-index       1
set  -g pane-base-index  1
set  -g renumber-windows on
setw -g automatic-rename on

# Change default work dir
bind m attach -c '#{pane_current_path}'

# ccmux keybinding
bind a display-popup -E -w 80% -h 75% "ccmux"

# For yazi image preview
set -qg  allow-passthrough all
set -qga update-environment TERM
set -qga update-environment TERM_PROGRAM

# use different mapping when in docker or ssh session
if -b '[ -n "$TMUX_REMOTE" ]' {
    set -g status-position top
    set -g prefix M-q
    bind    M-q     resize-pane -Z
    bind    M-p     previous-window
    bind    M-n     next-window
    bind -n M-Left  previous-window
    bind -n M-Right next-window
    bind    'M-\'  popup -w 80% "$SHELL"
} {
    set -g status-position bottom
    set -g prefix C-q
    bind    C-q resize-pane -Z
    bind    C-p previous-window
    bind    C-n next-window
    bind -n C-Left  previous-window
    bind -n C-Right next-window
    bind    'C-\' popup -w 80% "$SHELL"
}

# tmup (replaces tpm)
run-shell "tmup init"
