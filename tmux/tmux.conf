# Version-specific commands [grumble, grumble]
# See: https://github.com/tmux/tmux/blob/master/CHANGES
run-shell 'tmux setenv -g TMUX_VERSION $(tmux -V | \
                           sed -En "s/^tmux[^0-9]*([.0-9]+).*/\1/p")'

set -g default-command "${SHELL}"

bind -r tab  select-pane -t :.+
bind -r btab select-pane -t :.-

# Select pane
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

setw -g mode-keys vi

set -g repeat-time 500

# Split window
# bind _ split-window -v
# bind | split-window -h

set -g repeat-time 500

# Move window
bind -r < swap-window -t -1
bind -r > swap-window -t +1

# rename session
bind . command-prompt -I "#S" "rename-session '%%'"

# Resize panes like vim
bind -r H resize-pane -L 4
bind -r L resize-pane -R 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4

# TrueColor
set -g  default-terminal   "tmux-256color"
set -ag terminal-overrides ",tmux-256color:RGB:sitm=\\E\[3m"
set -as terminal-features  ",tmux-256color:clipboard"
set -ag terminal-features  ",*:hyperlinks"

set -g history-limit 102400 # boost history
set -g status-keys   emacs

# Capture pane and save to file
bind P command-prompt -p "Save to:" -I "/tmp/tmux-capture.txt" "capture-pane -S -; save-buffer '%%'"

# Copy
setw -g mode-keys vi
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi L      send -X end-of-line
bind -T copy-mode-vi H      send -X start-of-line

# Clipboard
set -s set-clipboard on

# Mouse support
set -g mouse on # Tmux 2.1 and later

# Index & Name
set  -g base-index       1
set  -g pane-base-index  1
set  -g renumber-windows on
setw -g automatic-rename on

# Goyo
bind G set status

# Change default work dir
bind m attach -c '#{pane_current_path}'

# For yazi image preview
if-shell -b '[ "$(echo "$TMUX_VERSION >= 3.3" | bc)" = 1 ]' {
    set -g allow-passthrough all
    set -ga update-environment TERM
    set -ga update-environment TERM_PROGRAM
}

# use different mapping when in docker or ssh session
if -b '[ -n "$SSH_CLIENT" ] || [ -f /.dockerenv ]' {
    set -g status-position top
    set -g prefix M-q
    bind    M-q resize-pane -Z
    bind    M-p previous-window
    bind    M-n next-window
    bind -n M-Left previous-window
    bind -n M-Right next-window
    bind    M-w run-shell -b "~/.local/share/tmup/plugins/github.com/wfxr/tmux-fzf/scripts/session.sh attach"
    bind    'M-\' popup -w 80% "$SHELL"
} {
    set -g status-position bottom
    set -g prefix C-q
    bind    C-q resize-pane -Z
    bind    C-p previous-window
    bind    C-n next-window
    bind -n C-Left previous-window
    bind -n C-Right next-window
    bind    C-w run-shell -b "~/.local/share/tmup/plugins/github.com/wfxr/tmux-fzf/scripts/session.sh attach"
    bind    'C-\' popup -w 80% "$SHELL"
}

if -b '"$(uname)" = Darwin' 'source-file ~/.tmux_osx.conf'

# tmux-fzf env vars (must be set before tmup init)
setenv -g TMUX_FZF_LAUNCH_KEY "C-f"
setenv -g TMUX_FZF_OPTIONS    "-p -w 62% -h 38% -m --border=none"

# ccmux keybinding
bind-key a display-popup -E -w 80% -h 75% "ccmux"

# tmup (replaces tpm)
run-shell "tmup init"
