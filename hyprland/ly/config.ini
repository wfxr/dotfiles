; Ly 1.4.1. Unspecified options use Ly's built-in defaults.
; Use indexed colors on the Linux console; startup.sh loads the RGB palette.
; Indices: 1 = background, 2 = red, 3 = green, 4 = yellow, 6 = lavender, 8 = text.

; Catppuccin Frappe
full_color = false
bg = 0x00000001
fg = 0x00000008
border_fg = 0x00000006
error_bg = 0x00000001
error_fg = 0x01000002
blank_box = true
start_cmd = /etc/ly/startup.sh

animation = doom
; animation = matrix
animation_frame_delay = 10

doom_fire_height = 6
doom_fire_spread = 2
doom_top_color = 0x00000002
doom_middle_color = 0x00000004
doom_bottom_color = 0x00000008
cmatrix_fg = 0x00000003
cmatrix_head_col = 0x01000008

clock = %Y-%m-%d %H:%M:%S
; box_title = phantom
lang = en

; Remember the username and session; focus the password field next time.
save = true
default_input = password

; Discover the installed Hyprland session and use its start-hyprland command.
waylandsessions = /usr/share/wayland-sessions
